spring.application.name=SpringRestAppDemo
server.servlet.context-path=/nst2025demo

# baza na XAMPP-u (port 3306, root bez lozinke)
spring.datasource.url=jdbc:mysql://localhost:3306/nst2025
spring.datasource.username=root
spring.datasource.password=

# swagger
springdoc.swagger-ui.path=/test-ui.html

# Liquibase je iskljucen: bazu pravi skript bazafinal.sql
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:/liquibase/mysql/db-changelog-master.xml

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl